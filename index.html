<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inequality Scale Explorer</title>
  <style>
    :root {
      --panel: #ffffff;
      --line: #d8dced;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --weight: #f59e0b;
      --xbox: #8b5cf6;
      --platform: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f9fbff 0%, #eef2ff 100%);
      color: var(--text);
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
      min-height: 100vh;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(31, 41, 55, 0.06);
      padding: 14px;
    }

    .scale-wrap {
      position: relative;
      min-height: 900px;
      overflow: hidden;
      border-radius: 18px;
      background: radial-gradient(circle at top, #ffffff 0%, #f5f7ff 50%, #eef2ff 100%);
      border: 1px solid var(--line);
    }

    .scale-stage {
      position: relative;
      width: 100%;
      height: 900px;
    }

    .state-aura {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transition: background 0.45s ease;
    }

    .state-aura.equal {
      background: radial-gradient(circle at center, rgba(34,197,94,0.14) 0%, rgba(34,197,94,0.06) 18%, rgba(255,255,255,0) 44%);
    }

    .state-aura.less {
      background: linear-gradient(90deg, rgba(59,130,246,0.08) 0%, rgba(255,255,255,0) 36%, rgba(249,115,22,0.08) 100%);
    }

    .state-aura.greater {
      background: linear-gradient(90deg, rgba(249,115,22,0.08) 0%, rgba(255,255,255,0) 64%, rgba(59,130,246,0.08) 100%);
    }

    .original-expression {
      position: absolute;
      left: 50%;
      top: 340px;
      transform: translate(-50%, -50%);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 16px;
      background: #ffffff;
      box-shadow: 0 8px 16px rgba(31, 41, 55, 0.1);
      color: #000;
      font-weight: 700;
      z-index: 3;
      white-space: nowrap;
    }

    .current-expression-pill {
      position: absolute;
      left: 50%;
      top: 388px;
      transform: translate(-50%, -50%);
      border: 1px solid #c7d2fe;
      border-radius: 999px;
      padding: 8px 14px;
      background: #eef2ff;
      box-shadow: 0 6px 12px rgba(31, 41, 55, 0.08);
      color: #1e3a8a;
      font-weight: 700;
      z-index: 3;
      white-space: nowrap;
    }

    .platform-group {
      position: absolute;
      width: 320px;
      height: 380px;
      transform: translateX(-50%);
      transition: top 0.45s cubic-bezier(.22,1,.36,1), filter 0.45s ease;
      z-index: 1;
    }

    .platform-group.left { left: 26%; }
    .platform-group.right { left: 74%; }

    .platform-group.lighter { filter: drop-shadow(0 14px 18px rgba(37, 99, 235, 0.16)); }
    .platform-group.heavier { filter: drop-shadow(0 18px 22px rgba(249, 115, 22, 0.2)); }
    .platform-group.equal { filter: drop-shadow(0 14px 18px rgba(34, 197, 94, 0.14)); }

    .platform {
      position: absolute;
      left: 50%;
      bottom: 130px;
      width: 240px;
      height: 22px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #cbd5e1 0%, var(--platform) 100%);
      border-radius: 999px;
      border: 1px solid rgba(100, 116, 139, 0.35);
      box-shadow: inset 0 -4px 0 rgba(100, 116, 139, 0.45);
    }

    .items {
      position: absolute;
      left: 50%;
      bottom: 162px;
      transform: translateX(-50%);
      width: 230px;
      min-height: 150px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-end;
      justify-content: center;
      padding-bottom: 12px;
    }

    .item {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      box-shadow: 0 5px 10px rgba(0,0,0,0.12);
      animation: popIn 0.25s ease;
    }

    .weight { background: var(--weight); }
    .xbox { background: var(--xbox); width: 56px; }

    .item.negative {
      background: #ffffff;
      box-shadow: none;
      border-style: dashed;
      border-width: 2px;
      font-weight: 700;
    }

    .weight.negative {
      border-color: var(--weight);
      color: #b45309;
    }

    .xbox.negative {
      border-color: var(--xbox);
      color: #6d28d9;
    }

    .platform-input {
      position: absolute;
      left: 50%;
      bottom: 58px;
      transform: translateX(-50%);
      width: 240px;
    }

    .center-controls {
      position: absolute;
      left: 50%;
      top: 422px;
      transform: translateX(-50%);
      display: grid;
      gap: 12px;
      justify-items: center;
      z-index: 4;
    }

    .expr-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 1rem;
      background: rgba(255,255,255,0.95);
    }

    .mode-switch {
      display: inline-flex;
      background: #e5e7eb;
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
    }

    .mode-switch button {
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      background: transparent;
      color: var(--text);
      font-weight: 600;
    }

    .mode-switch button.active {
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    .controls-swap {
      position: absolute;
      left: 50%;
      bottom: 54px;
      transform: translateX(-50%);
      min-height: 42px;
      z-index: 4;
    }

    .trial-controls {
      display: none;
      gap: 8px;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 12px;
    }

    .trial-controls.show { display: flex; }

    .x-direct {
      width: 88px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .attempts-count {
      font-weight: 700;
      color: #1e3a8a;
      background: #eff6ff;
      border-radius: 999px;
      padding: 4px 10px;
      border: 1px solid #bfdbfe;
    }

    .swipe-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .swipe-track {
      width: 110px;
      height: 200px;
      border-radius: 999px;
      background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
      border: 1px solid #bfdbfe;
      position: relative;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    .track-line {
      position: absolute;
      left: 50%;
      top: 16px;
      bottom: 16px;
      width: 4px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #c7d2fe 0%, #93c5fd 100%);
      border-radius: 999px;
    }

    .track-stop {
      position: absolute;
      left: 50%;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid #93c5fd;
      background: white;
    }

    .track-stop.top { top: 26px; }
    .track-stop.mid { top: 100px; }
    .track-stop.bottom { top: 174px; }

    .swipe-thumb {
      position: absolute;
      left: 50%;
      width: 54px;
      height: 54px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff 0%, #dbeafe 45%, #60a5fa 100%);
      border: 2px solid #60a5fa;
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.18);
      transition: top 0.45s cubic-bezier(.22,1,.36,1), box-shadow 0.2s ease, transform 0.2s ease;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #1d4ed8;
      z-index: 2;
    }

    .swipe-thumb.dragging {
      transition: none;
      cursor: grabbing;
      transform: translate(-50%, -50%) scale(1.04);
    }

    button {
      border: 1px solid var(--line);
      background: white;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .op-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .op-row button {
      opacity: 0.5;
      background: #fff;
    }

    .op-row button:hover {
      opacity: 0.85;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.92);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="panel">
      <div class="scale-wrap">
        <div class="scale-stage">
          <div class="state-aura equal" id="stateAura"></div>

          <div class="original-expression" id="originalExpression">Original: x + 3 = 8</div>
          <div class="current-expression-pill" id="currentExpressionPill">Currently solving: x + 3 = 8</div>

          <div class="platform-group left equal" id="leftGroup">
            <div class="items" id="leftItems"></div>
            <div class="platform"></div>
            <div class="platform-input">
              <input id="leftInput" class="expr-input" type="text" value="x + 3" aria-label="Left expression" />
            </div>
          </div>

          <div class="platform-group right equal" id="rightGroup">
            <div class="items" id="rightItems"></div>
            <div class="platform"></div>
            <div class="platform-input">
              <input id="rightInput" class="expr-input" type="text" value="8" aria-label="Right expression" />
            </div>
          </div>

          <div class="center-controls">
            <div class="swipe-wrap">
              <div class="swipe-track" id="swipeTrack" aria-label="Relation state slider">
                <div class="track-line"></div>
                <div class="track-stop top"></div>
                <div class="track-stop mid"></div>
                <div class="track-stop bottom"></div>
                <div class="swipe-thumb" id="swipeThumb">=</div>
              </div>
            </div>
            <button id="buildBtn" class="primary">Build</button>
            <button id="restoreBtn" type="button">Restore expression</button>
            <div class="mode-switch" role="tablist" aria-label="Mode switch">
              <button id="modeTrial" type="button">Trial & Error mode</button>
              <button id="modeIsolate" type="button" class="active">Isolate X mode</button>
            </div>
          </div>

          <div class="controls-swap">
            <div class="trial-controls" id="trialControls">
              <label for="xSlider">x value:</label>
              <input id="xSlider" type="range" step="0.1" />
              <input id="xDirectInput" class="x-direct" type="number" step="0.1" aria-label="Direct x value input" />
              <span id="xSliderValue"></span>
              <span class="attempts-count" id="attemptsCount">Attempts tried: 0</span>
            </div>

            <div class="op-row" id="opRow">
              <button class="opBtn" data-kind="constant" data-op="1">+1</button>
              <button class="opBtn" data-kind="constant" data-op="5">+5</button>
              <button class="opBtn" data-kind="constant" data-op="-1">-1</button>
              <button class="opBtn" data-kind="constant" data-op="-5">-5</button>
              <button class="opBtn" data-kind="x" data-op="1">+x</button>
              <button class="opBtn" data-kind="x" data-op="-1">-x</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const leftInput = document.getElementById('leftInput');
    const rightInput = document.getElementById('rightInput');
    const buildBtn = document.getElementById('buildBtn');
    const restoreBtn = document.getElementById('restoreBtn');
    const leftItems = document.getElementById('leftItems');
    const rightItems = document.getElementById('rightItems');
    const leftGroup = document.getElementById('leftGroup');
    const rightGroup = document.getElementById('rightGroup');
    const stateAura = document.getElementById('stateAura');
    const swipeTrack = document.getElementById('swipeTrack');
    const swipeThumb = document.getElementById('swipeThumb');
    const modeTrial = document.getElementById('modeTrial');
    const modeIsolate = document.getElementById('modeIsolate');
    const trialControls = document.getElementById('trialControls');
    const xSlider = document.getElementById('xSlider');
    const xDirectInput = document.getElementById('xDirectInput');
    const xSliderValue = document.getElementById('xSliderValue');
    const attemptsCount = document.getElementById('attemptsCount');
    const opRow = document.getElementById('opRow');
    const originalExpression = document.getElementById('originalExpression');
    const currentExpressionPill = document.getElementById('currentExpressionPill');

    const relationOrder = ['<', '=', '>'];
    const relationStops = { '<': 26, '=': 100, '>': 174 };
    const baseY = 250;
    const maxTilt = 80;

    const state = {
      mode: 'isolate',
      relation: '=',
      left: { x: 0, constant: 0 },
      right: { x: 0, constant: 0 },
      original: 'x + 3 = 8',
      originalLeft: { x: 1, constant: 3 },
      originalRight: { x: 0, constant: 8 },
      originalRelation: '=',
      xTrial: 0,
      trialRange: { min: -10, max: 10 },
      attemptsTried: 0
    };

    function parseSide(sideStr) {
      const cleaned = sideStr.replace(/\s+/g, '');
      if (!cleaned) return { x: 0, constant: 0 };
      const tokens = cleaned.match(/[+-]?[^+-]+/g);
      if (!tokens) throw new Error('Could not read one side of the expression.');

      let x = 0;
      let constant = 0;
      for (let token of tokens) {
        if (!token) continue;
        let sign = 1;
        if (token[0] === '+') token = token.slice(1);
        else if (token[0] === '-') { sign = -1; token = token.slice(1); }

        if (token.toLowerCase() === 'x') x += sign;
        else if (/^\d+x$/i.test(token)) x += sign * parseInt(token, 10);
        else if (/^\d+$/.test(token)) constant += sign * parseInt(token, 10);
        else throw new Error(`Unsupported term: ${token}`);
      }
      return { x, constant };
    }

    function validateLinearForm(left, right) {
      if (right.x !== 0) throw new Error('Use ax + b = c format: right side must be a constant.');
      if (left.x === 0) throw new Error('Use ax + b = c format: left side must contain x term (a ≠ 0).');
    }

    function formatSide(side) {
      const parts = [];
      if (side.x !== 0) {
        if (side.x === 1) parts.push('x');
        else if (side.x === -1) parts.push('-x');
        else parts.push(`${side.x}x`);
      }
      if (side.constant !== 0 || parts.length === 0) parts.push(String(side.constant));
      return parts.join(' + ').replace(/\+ -/g, '- ');
    }

    function massAtX(side, xValue) {
      return side.x * xValue + side.constant;
    }

    function relationForDifference(diff) {
      if (Math.abs(diff) < 0.0001) return '=';
      return diff < 0 ? '<' : '>';
    }

    function solutionX() {
      const a = state.left.x - state.right.x;
      const b = state.right.constant - state.left.constant;
      if (a === 0) return null;
      return b / a;
    }

    function computeTiltRatio() {
      if (state.mode === 'trial') {
        const leftVal = massAtX(state.left, state.xTrial);
        const rightVal = massAtX(state.right, state.xTrial);
        const diff = leftVal - rightVal;
        const denom = Math.max(1, Math.abs(state.trialRange.max - state.trialRange.min));
        return Math.max(-1, Math.min(1, (diff * 2) / denom));
      }
      if (state.relation === '=') return 0;
      return state.relation === '<' ? -1 : 1;
    }

    function updateGroups() {
      const ratio = computeTiltRatio();
      leftGroup.style.top = `${baseY + ratio * maxTilt}px`;
      rightGroup.style.top = `${baseY - ratio * maxTilt}px`;

      const leftClass = ratio < -0.05 ? 'lighter' : ratio > 0.05 ? 'heavier' : 'equal';
      const rightClass = ratio > 0.05 ? 'lighter' : ratio < -0.05 ? 'heavier' : 'equal';
      leftGroup.className = `platform-group left ${leftClass}`;
      rightGroup.className = `platform-group right ${rightClass}`;

      const auraClass = ratio === 0 ? 'equal' : ratio < 0 ? 'less' : 'greater';
      stateAura.className = `state-aura ${auraClass}`;
    }

    function makeItem(className, label, isNegative = false) {
      const div = document.createElement('div');
      div.className = `item ${className}${isNegative ? ' negative' : ''}`;
      div.textContent = label;
      return div;
    }

    function renderSideItems(container, side) {
      container.innerHTML = '';
      const xLabel = state.mode === 'trial'
        ? `x=${Number(state.xTrial).toFixed(1)}`
        : (side.x >= 0 ? 'x' : '-x');
      for (let i = 0; i < Math.abs(side.x); i++) container.appendChild(makeItem('xbox', xLabel, side.x < 0));
      for (let i = 0; i < Math.abs(side.constant); i++) container.appendChild(makeItem('weight', side.constant >= 0 ? '1' : '-1', side.constant < 0));
    }

    function updateThumb() {
      let thumbTop = relationStops[state.relation];
      if (state.mode === 'trial') {
        const ratio = computeTiltRatio();
        thumbTop = relationStops['='] + ratio * (relationStops['>'] - relationStops['=']);
        thumbTop = Math.max(relationStops['<'], Math.min(relationStops['>'], thumbTop));
      }
      swipeThumb.style.top = `${thumbTop}px`;
      swipeThumb.textContent = state.relation;
    }

    function setTrialRange() {
      const xSol = solutionX();
      if (xSol === null || !Number.isFinite(xSol)) {
        state.trialRange = { min: -10, max: 10 };
        state.xTrial = state.trialRange.min;
      } else {
        state.trialRange = { min: xSol - 10, max: xSol + 10 };
        state.xTrial = state.trialRange.min;
      }
      xSlider.min = state.trialRange.min;
      xSlider.max = state.trialRange.max;
      xSlider.value = state.xTrial;
      xDirectInput.min = state.trialRange.min;
      xDirectInput.max = state.trialRange.max;
      xDirectInput.value = state.xTrial;
      xSliderValue.textContent = Number(state.xTrial).toFixed(1);
    }

    function updateCurrentExpressionPill() {
      currentExpressionPill.textContent = `Currently solving: ${formatSide(state.left)} ${state.relation} ${formatSide(state.right)}`;
    }

    function setTrialX(nextX) {
      const clamped = Math.max(state.trialRange.min, Math.min(state.trialRange.max, nextX));
      if (!Number.isFinite(clamped)) return;
      if (Math.abs(clamped - state.xTrial) > 0.0001) state.attemptsTried += 1;
      state.xTrial = clamped;
      xSlider.value = state.xTrial;
      xDirectInput.value = Number(state.xTrial).toFixed(1);
      render();
    }

    function commitDirectXInput() {
      setTrialX(parseFloat(xDirectInput.value));
    }

    function syncTrialRelation() {
      if (state.mode !== 'trial') return;
      const diff = massAtX(state.left, state.xTrial) - massAtX(state.right, state.xTrial);
      state.relation = relationForDifference(diff);
    }

    function render() {
      renderSideItems(leftItems, state.left);
      renderSideItems(rightItems, state.right);
      syncTrialRelation();
      updateThumb();
      updateGroups();
      xSliderValue.textContent = Number(state.xTrial).toFixed(1);
      attemptsCount.textContent = `Attempts tried: ${state.attemptsTried}`;
      updateCurrentExpressionPill();
    }

    function buildFromInputs() {
      try {
        const left = parseSide(leftInput.value);
        const right = parseSide(rightInput.value);
        validateLinearForm(left, right);
        state.left = left;
        state.right = right;
        state.originalRelation = state.relation;
        state.original = `${formatSide(left)} ${state.originalRelation} ${formatSide(right)}`;
        state.originalLeft = { ...left };
        state.originalRight = { ...right };
        originalExpression.textContent = `Original: ${state.original}`;
        state.attemptsTried = 0;
        setTrialRange();
        render();
      } catch (err) {
        alert(err.message);
      }
    }

    function applyConstantAddSubtract(amount) {
      state.left.constant += amount;
      state.right.constant += amount;
      leftInput.value = formatSide(state.left);
      rightInput.value = formatSide(state.right);
      if (state.mode === 'trial') setTrialRange();
      render();
    }

    function applyXAddSubtract(amount) {
      state.left.x += amount;
      state.right.x += amount;
      leftInput.value = formatSide(state.left);
      rightInput.value = formatSide(state.right);
      if (state.mode === 'trial') setTrialRange();
      render();
    }

    function setRelation(relation) {
      if (state.mode === 'trial') return;
      state.relation = relation;
      render();
    }

    function relationFromY(clientY) {
      const rect = swipeTrack.getBoundingClientRect();
      const y = clientY - rect.top;
      const distances = relationOrder.map(rel => ({ rel, dist: Math.abs(y - relationStops[rel]) }));
      distances.sort((a, b) => a.dist - b.dist);
      return distances[0].rel;
    }

    function setMode(mode) {
      state.mode = mode;
      modeTrial.classList.toggle('active', mode === 'trial');
      modeIsolate.classList.toggle('active', mode === 'isolate');
      trialControls.classList.toggle('show', mode === 'trial');
      opRow.style.display = mode === 'trial' ? 'none' : 'flex';
      swipeThumb.style.cursor = mode === 'trial' ? 'default' : 'grab';
      if (mode === 'trial') {
        state.attemptsTried = 0;
        setTrialRange();
      }
      render();
    }

    let dragging = false;

    function startDrag(e) {
      if (state.mode === 'trial') return;
      dragging = true;
      swipeThumb.classList.add('dragging');
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      swipeThumb.style.top = `${Math.max(26, Math.min(174, clientY - swipeTrack.getBoundingClientRect().top))}px`;
      e.preventDefault();
    }

    function moveDrag(e) {
      if (!dragging || state.mode === 'trial') return;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const rect = swipeTrack.getBoundingClientRect();
      const top = Math.max(26, Math.min(174, clientY - rect.top));
      swipeThumb.style.top = `${top}px`;
      e.preventDefault();
    }

    function endDrag(e) {
      if (!dragging || state.mode === 'trial') return;
      dragging = false;
      swipeThumb.classList.remove('dragging');
      const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
      setRelation(relationFromY(clientY));
      e.preventDefault();
    }

    buildBtn.addEventListener('click', buildFromInputs);
    leftInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') buildFromInputs(); });
    rightInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') buildFromInputs(); });

    document.querySelectorAll('.opBtn').forEach(btn => {
      btn.addEventListener('click', () => {
        const amount = parseInt(btn.dataset.op, 10);
        if (btn.dataset.kind === 'x') applyXAddSubtract(amount);
        else applyConstantAddSubtract(amount);
      });
    });

    modeTrial.addEventListener('click', () => setMode('trial'));
    modeIsolate.addEventListener('click', () => setMode('isolate'));
    restoreBtn.addEventListener('click', () => {
      state.left = { ...state.originalLeft };
      state.right = { ...state.originalRight };
      state.relation = state.originalRelation;
      leftInput.value = formatSide(state.left);
      rightInput.value = formatSide(state.right);
      state.attemptsTried = 0;
      setTrialRange();
      render();
    });

    xSlider.addEventListener('input', () => {
      setTrialX(parseFloat(xSlider.value));
    });

    xDirectInput.addEventListener('change', commitDirectXInput);
    xDirectInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') commitDirectXInput();
    });

    swipeThumb.addEventListener('mousedown', startDrag);
    swipeTrack.addEventListener('mousedown', (e) => {
      if (state.mode === 'trial' || e.target === swipeThumb) return;
      setRelation(relationFromY(e.clientY));
    });
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', endDrag);

    swipeThumb.addEventListener('touchstart', startDrag, { passive: false });
    swipeTrack.addEventListener('touchstart', (e) => {
      if (state.mode === 'trial' || e.target === swipeThumb) return;
      setRelation(relationFromY(e.touches[0].clientY));
      e.preventDefault();
    }, { passive: false });
    window.addEventListener('touchmove', moveDrag, { passive: false });
    window.addEventListener('touchend', endDrag, { passive: false });

    buildFromInputs();
  </script>
</body>
</html>
