<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inequality Scale Explorer</title>
  <style>
    :root {
      --panel: #ffffff;
      --line: #d8dced;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --weight: #f59e0b;
      --xbox: #8b5cf6;
      --platform: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f9fbff 0%, #eef2ff 100%);
      color: var(--text);
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
      min-height: 100vh;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(31, 41, 55, 0.06);
      padding: 14px;
    }

    .scale-wrap {
      position: relative;
      min-height: 900px;
      overflow: hidden;
      border-radius: 18px;
      background: radial-gradient(circle at top, #ffffff 0%, #f5f7ff 50%, #eef2ff 100%);
      border: 1px solid var(--line);
    }

    .scale-stage {
      position: relative;
      width: 100%;
      height: 900px;
    }

    .state-aura {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transition: background 0.45s ease;
    }

    .state-aura.equal {
      background: radial-gradient(circle at center, rgba(34,197,94,0.14) 0%, rgba(34,197,94,0.06) 18%, rgba(255,255,255,0) 44%);
    }

    .state-aura.less {
      background: linear-gradient(90deg, rgba(59,130,246,0.08) 0%, rgba(255,255,255,0) 36%, rgba(249,115,22,0.08) 100%);
    }

    .state-aura.greater {
      background: linear-gradient(90deg, rgba(249,115,22,0.08) 0%, rgba(255,255,255,0) 64%, rgba(59,130,246,0.08) 100%);
    }

    .pivot-circle {
      position: absolute;
      left: 50%;
      top: 340px;
      width: 94px;
      height: 94px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #475569 0%, #1f2937 52%, #0f172a 100%);
      box-shadow: 0 18px 36px rgba(15, 23, 42, 0.25), 0 0 0 10px rgba(255,255,255,0.45);
      z-index: 2;
    }

    .pivot-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
    }

    .platform-group {
      position: absolute;
      width: 320px;
      height: 380px;
      transform: translateX(-50%);
      transition: top 0.55s cubic-bezier(.22,1,.36,1), filter 0.45s ease;
      z-index: 1;
    }

    .platform-group.left { left: 26%; }
    .platform-group.right { left: 74%; }

    .platform-group.lighter { filter: drop-shadow(0 14px 18px rgba(37, 99, 235, 0.16)); }
    .platform-group.heavier { filter: drop-shadow(0 18px 22px rgba(249, 115, 22, 0.2)); }
    .platform-group.equal { filter: drop-shadow(0 14px 18px rgba(34, 197, 94, 0.14)); }

    .platform-label {
      position: absolute;
      left: 50%;
      top: -30px;
      transform: translateX(-50%);
      font-weight: 700;
      font-size: 2rem;
      color: var(--muted);
      white-space: nowrap;
      opacity: 0.9;
    }

    .platform {
      position: absolute;
      left: 50%;
      bottom: 130px;
      width: 240px;
      height: 22px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #cbd5e1 0%, var(--platform) 100%);
      border-radius: 999px;
      border: 1px solid rgba(100, 116, 139, 0.35);
      box-shadow: inset 0 -4px 0 rgba(100, 116, 139, 0.45);
    }

    .items {
      position: absolute;
      left: 50%;
      bottom: 162px;
      transform: translateX(-50%);
      width: 230px;
      min-height: 150px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-end;
      justify-content: center;
      padding-bottom: 12px;
    }

    .items.stacked {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: nowrap;
    }

    .stack-col {
      min-width: 36px;
      max-width: 44px;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 4px;
      padding: 10px 8px;
      border-radius: 10px;
      border: 3px dashed #93c5fd;
      background: rgba(219, 234, 254, 0.35);
    }

    .item {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      box-shadow: 0 5px 10px rgba(0,0,0,0.12);
      animation: popIn 0.25s ease;
    }

    .item.partial {
      position: relative;
      overflow: hidden;
      color: #7c2d12;
      border: 2px solid #b45309;
      background: linear-gradient(
        to top,
        rgba(245, 158, 11, 0.95) 0%,
        rgba(245, 158, 11, 0.95) calc(var(--fill-ratio, 0.5) * 100%),
        rgba(245, 158, 11, 0.12) calc(var(--fill-ratio, 0.5) * 100%),
        rgba(245, 158, 11, 0.12) 100%
      );
    }

    .item.partial::after {
      content: attr(data-fraction);
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      font-weight: 800;
      color: #7c2d12;
      background: rgba(255, 255, 255, 0.2);
    }

    .item.partial.negative {
      background: linear-gradient(
        to top,
        rgba(251, 146, 60, 0.45) 0%,
        rgba(251, 146, 60, 0.45) calc(var(--fill-ratio, 0.5) * 100%),
        rgba(255, 255, 255, 0.9) calc(var(--fill-ratio, 0.5) * 100%),
        rgba(255, 255, 255, 0.9) 100%
      );
    }

    .weight { background: var(--weight); }
    .xbox { background: var(--xbox); width: 56px; }

    .item.negative {
      background: #ffffff;
      box-shadow: none;
      border-style: dashed;
      border-width: 2px;
      font-weight: 700;
    }

    .weight.negative {
      border-color: var(--weight);
      color: #b45309;
    }

    .xbox.negative {
      border-color: var(--xbox);
      color: #6d28d9;
    }

    .platform-input {
      position: absolute;
      left: 50%;
      bottom: 58px;
      transform: translateX(-50%);
      width: 240px;
      display: grid;
      gap: 6px;
    }

    .platform-input label {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 1rem;
      background: rgba(255,255,255,0.95);
    }

    .center-controls {
      position: absolute;
      left: 50%;
      top: 430px;
      transform: translateX(-50%);
      display: grid;
      gap: 12px;
      justify-items: center;
      z-index: 3;
    }

    .current-expression {
      margin: 0;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #bfdbfe;
      background: rgba(239, 246, 255, 0.8);
      color: #1d4ed8;
      font-weight: 700;
      font-size: 0.92rem;
      text-align: center;
    }

    .swipe-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .swipe-track {
      width: 110px;
      height: 200px;
      border-radius: 999px;
      background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
      border: 1px solid #bfdbfe;
      position: relative;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    .track-line {
      position: absolute;
      left: 50%;
      top: 16px;
      bottom: 16px;
      width: 4px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #c7d2fe 0%, #93c5fd 100%);
      border-radius: 999px;
    }

    .track-stop {
      position: absolute;
      left: 50%;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid #93c5fd;
      background: white;
    }

    .track-stop.top { top: 26px; }
    .track-stop.mid { top: 100px; }
    .track-stop.bottom { top: 174px; }

    .swipe-thumb {
      position: absolute;
      left: 50%;
      width: 54px;
      height: 54px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff 0%, #dbeafe 45%, #60a5fa 100%);
      border: 2px solid #60a5fa;
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.18);
      transition: top 0.45s cubic-bezier(.22,1,.36,1), box-shadow 0.2s ease, transform 0.2s ease;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #1d4ed8;
      z-index: 2;
    }

    .swipe-thumb.dragging {
      transition: none;
      cursor: grabbing;
      transform: translate(-50%, -50%) scale(1.04);
    }

    button {
      border: 1px solid var(--line);
      background: white;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .op-row {
      position: absolute;
      left: 50%;
      bottom: 54px;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      z-index: 4;
    }

    .op-row button {
      opacity: 0.5;
      background: #fff;
    }

    .op-row button:hover {
      opacity: 0.85;
    }

    .statement {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      z-index: 4;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.92);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 980px) {
      .scale-wrap,
      .scale-stage {
        min-height: 1020px;
        height: 1020px;
      }

      .platform-group {
        width: 280px;
      }

      .platform-group.left { left: 24%; }
      .platform-group.right { left: 76%; }

      .center-controls {
        top: 470px;
      }

      .op-row {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="panel">
      <div class="scale-wrap">
        <div class="scale-stage">
          <div class="state-aura equal" id="stateAura"></div>

          <div class="pivot-circle">
            <div class="pivot-core"></div>
          </div>

          <div class="platform-group left equal" id="leftGroup">
            <div class="platform-label">Left platform</div>
            <div class="items" id="leftItems"></div>
            <div class="platform"></div>
            <div class="platform-input">
              <label for="leftInput">Left input</label>
              <input id="leftInput" type="text" value="x + 3" />
            </div>
          </div>

          <div class="platform-group right equal" id="rightGroup">
            <div class="platform-label">Right platform</div>
            <div class="items" id="rightItems"></div>
            <div class="platform"></div>
            <div class="platform-input">
              <label for="rightInput">Right input</label>
              <input id="rightInput" type="text" value="8" />
            </div>
          </div>

          <div class="center-controls">
            <div class="swipe-wrap">
              <div class="swipe-track" id="swipeTrack" aria-label="Relation state slider">
                <div class="track-line"></div>
                <div class="track-stop top"></div>
                <div class="track-stop mid"></div>
                <div class="track-stop bottom"></div>
                <div class="swipe-thumb" id="swipeThumb">=</div>
              </div>
            </div>
            <button id="buildBtn" class="primary">Build</button>
            <button id="restoreBtn">Restore expression</button>
            <p class="current-expression" id="currentExpression">Currently solving: (build an expression)</p>
          </div>

          <div class="op-row">
            <button class="opBtn" data-kind="constant" data-op="1">+1</button>
            <button class="opBtn" data-kind="constant" data-op="5">+5</button>
            <button class="opBtn" data-kind="constant" data-op="-1">-1</button>
            <button class="opBtn" data-kind="constant" data-op="-5">-5</button>
            <button class="opBtn" data-kind="x" data-op="1">+x</button>
            <button class="opBtn" data-kind="x" data-op="-1">-x</button>
            <button class="opBtn" data-kind="divide-x">÷ number of x</button>
          </div>

          <div class="statement" id="statementLine"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const leftInput = document.getElementById('leftInput');
    const rightInput = document.getElementById('rightInput');
    const buildBtn = document.getElementById('buildBtn');
    const statementLine = document.getElementById('statementLine');
    const leftItems = document.getElementById('leftItems');
    const rightItems = document.getElementById('rightItems');
    const leftGroup = document.getElementById('leftGroup');
    const rightGroup = document.getElementById('rightGroup');
    const stateAura = document.getElementById('stateAura');
    const swipeTrack = document.getElementById('swipeTrack');
    const swipeThumb = document.getElementById('swipeThumb');
    const restoreBtn = document.getElementById('restoreBtn');
    const currentExpression = document.getElementById('currentExpression');

    const relationOrder = ['<', '=', '>'];
    const relationStops = { '<': 26, '=': 100, '>': 174 };
    const platformTop = { top: 170, center: 250, bottom: 330 };

    const state = {
      relation: '=',
      left: { x: 0, constant: 0 },
      right: { x: 0, constant: 0 },
      divideView: null,
      builtState: null
    };

    function parseSide(sideStr) {
      const cleaned = sideStr.replace(/\s+/g, '');
      if (!cleaned) return { x: 0, constant: 0 };

      const tokens = cleaned.match(/[+-]?[^+-]+/g);
      if (!tokens) throw new Error('Could not read one side of the expression.');

      let x = 0;
      let constant = 0;

      for (let token of tokens) {
        if (!token) continue;
        let sign = 1;
        if (token[0] === '+') token = token.slice(1);
        else if (token[0] === '-') {
          sign = -1;
          token = token.slice(1);
        }

        if (token.toLowerCase() === 'x') {
          x += sign;
        } else if (/^\d+x$/i.test(token)) {
          x += sign * parseInt(token, 10);
        } else if (/^\d+$/.test(token)) {
          constant += sign * parseInt(token, 10);
        } else {
          throw new Error(`Unsupported term: ${token}`);
        }
      }

      return { x, constant };
    }

    function formatSide(side) {
      const parts = [];
      if (side.x !== 0) {
        if (side.x === 1) parts.push('x');
        else if (side.x === -1) parts.push('-x');
        else parts.push(`${side.x}x`);
      }
      if (side.constant !== 0 || parts.length === 0) {
        parts.push(String(side.constant));
      }
      return parts.join(' + ').replace(/\+ -/g, '- ');
    }

    function getMassValue(side) {
      const xMass = 4;
      return side.x * xMass + side.constant;
    }

    function actualComparison() {
      const leftMass = getMassValue(state.left);
      const rightMass = getMassValue(state.right);
      if (leftMass === rightMass) return '=';
      return leftMass < rightMass ? '<' : '>';
    }

    function getPlatformState(sideName) {
      if (state.relation === '=') return 'center';
      if (state.relation === '<') return sideName === 'left' ? 'top' : 'bottom';
      return sideName === 'left' ? 'bottom' : 'top';
    }

    function getMoodClass(position) {
      if (position === 'top') return 'lighter';
      if (position === 'bottom') return 'heavier';
      return 'equal';
    }

    function updateGroups() {
      const leftPosition = getPlatformState('left');
      const rightPosition = getPlatformState('right');

      leftGroup.style.top = `${platformTop[leftPosition]}px`;
      rightGroup.style.top = `${platformTop[rightPosition]}px`;

      leftGroup.className = `platform-group left ${getMoodClass(leftPosition)}`;
      rightGroup.className = `platform-group right ${getMoodClass(rightPosition)}`;

      const auraClass = state.relation === '=' ? 'equal' : state.relation === '<' ? 'less' : 'greater';
      stateAura.className = `state-aura ${auraClass}`;
    }

    function makeItem(className, label, isNegative = false, fractionLabel = '', fractionRatio = null) {
      const div = document.createElement('div');
      div.className = `item ${className}${isNegative ? ' negative' : ''}`;
      div.textContent = label;
      if (fractionLabel) {
        div.classList.add('partial');
        div.dataset.fraction = fractionLabel;
        if (fractionRatio !== null) {
          div.style.setProperty('--fill-ratio', `${Math.max(0, Math.min(1, fractionRatio))}`);
        }
      }
      return div;
    }

    function renderSideItems(container, side) {
      container.classList.remove('stacked');
      container.innerHTML = '';

      const xCount = Math.abs(side.x);
      const constantCount = Math.abs(side.constant);

      for (let i = 0; i < xCount; i++) {
        container.appendChild(makeItem('xbox', side.x >= 0 ? 'x' : '-x', side.x < 0));
      }

      for (let i = 0; i < constantCount; i++) {
        container.appendChild(makeItem('weight', side.constant >= 0 ? '1' : '-1', side.constant < 0));
      }
    }

    function reduceFraction(numerator, denominator) {
      const gcd = (a, b) => b === 0 ? Math.abs(a) : gcd(b, a % b);
      const factor = gcd(numerator, denominator) || 1;
      return { numerator: numerator / factor, denominator: denominator / factor };
    }

    function renderStackedDivision(container, n, sideConstant) {
      container.innerHTML = '';
      container.classList.add('stacked');

      const isNegative = sideConstant < 0;
      const absTotal = Math.abs(sideConstant);
      const wholePerStack = Math.floor(absTotal / n);
      const remainder = absTotal % n;

      for (let stackIndex = 0; stackIndex < n; stackIndex++) {
        const stack = document.createElement('div');
        stack.className = 'stack-col';

        for (let i = 0; i < wholePerStack; i++) {
          stack.appendChild(makeItem('weight', isNegative ? '-1' : '1', isNegative));
        }

        if (remainder > 0) {
          const frac = reduceFraction(remainder, n);
          const fillRatio = remainder / n;
          stack.appendChild(
            makeItem('weight', '', isNegative, `${frac.numerator}/${frac.denominator}`, fillRatio)
          );
        }

        container.appendChild(stack);
      }
    }

    function updateThumb() {
      swipeThumb.style.top = `${relationStops[state.relation]}px`;
      swipeThumb.textContent = state.relation;
    }

    function updateStatus() {
      const actual = actualComparison();
      currentExpression.textContent = `Currently solving: ${formatSide(state.left)} ${state.relation} ${formatSide(state.right)}`;
      if (state.divideView) {
        const note = state.divideView.nonWhole
          ? `split into ${state.divideView.n} stacks: each x corresponds to ${state.divideView.perStackLabel} (fraction shown as partial block)`
          : `split into ${state.divideView.n} equal stacks: each x corresponds to ${state.divideView.perStackLabel}`;
        statementLine.textContent = `${formatSide(state.left)} ${state.relation} ${formatSide(state.right)} (${note}; actual mass comparison: ${actual})`;
        return;
      }
      statementLine.textContent = `${formatSide(state.left)} ${state.relation} ${formatSide(state.right)} (actual mass comparison: ${actual})`;
    }

    function saveBuiltState() {
      state.builtState = {
        relation: state.relation,
        left: { ...state.left },
        right: { ...state.right }
      };
    }

    function render() {
      if (state.divideView) {
        const xContainer = state.divideView.xSide === 'left' ? leftItems : rightItems;
        const otherContainer = state.divideView.xSide === 'left' ? rightItems : leftItems;
        const xSideState = state.divideView.xSide === 'left' ? state.left : state.right;
        renderSideItems(xContainer, xSideState);
        renderStackedDivision(otherContainer, state.divideView.n, state.divideView.otherConstant);
      } else {
        renderSideItems(leftItems, state.left);
        renderSideItems(rightItems, state.right);
      }
      updateThumb();
      updateGroups();
      updateStatus();
    }

    function buildFromInputs() {
      try {
        state.left = parseSide(leftInput.value);
        state.right = parseSide(rightInput.value);
        state.divideView = null;
        saveBuiltState();
        render();
      } catch (err) {
        alert(err.message);
      }
    }

    function restoreBuiltExpression() {
      if (!state.builtState) {
        alert('Build an expression first, then you can restore it.');
        return;
      }

      state.left = { ...state.builtState.left };
      state.right = { ...state.builtState.right };
      state.relation = state.builtState.relation;
      state.divideView = null;
      leftInput.value = formatSide(state.left);
      rightInput.value = formatSide(state.right);
      render();
    }

    function applyConstantAddSubtract(amount) {
      state.divideView = null;
      state.left.constant += amount;
      state.right.constant += amount;
      leftInput.value = formatSide(state.left);
      rightInput.value = formatSide(state.right);
      render();
    }

    function applyXAddSubtract(amount) {
      state.divideView = null;
      state.left.x += amount;
      state.right.x += amount;
      leftInput.value = formatSide(state.left);
      rightInput.value = formatSide(state.right);
      render();
    }

    function setRelation(relation) {
      state.relation = relation;
      render();
    }

    function applyDivideByNumberOfX() {
      let xSide = null;
      if (Math.abs(state.left.x) > 1 && state.right.x === 0) xSide = 'left';
      else if (Math.abs(state.right.x) > 1 && state.left.x === 0) xSide = 'right';

      if (!xSide) {
        alert('Use this when one side has n·x (n > 1) and the opposite side has no x terms.');
        return;
      }

      const n = Math.abs(xSide === 'left' ? state.left.x : state.right.x);
      const otherConstant = xSide === 'left' ? state.right.constant : state.left.constant;
      const perStack = otherConstant / n;
      const frac = reduceFraction(Math.abs(otherConstant), n);
      const sign = perStack < 0 ? '-' : '';
      const perStackLabel = Number.isInteger(perStack)
        ? `${perStack}`
        : `${sign}${frac.numerator}/${frac.denominator}`;

      state.divideView = {
        xSide,
        n,
        otherConstant,
        perStackLabel,
        nonWhole: !Number.isInteger(perStack)
      };
      render();
    }

    function relationFromY(clientY) {
      const rect = swipeTrack.getBoundingClientRect();
      const y = clientY - rect.top;
      const distances = relationOrder.map(rel => ({ rel, dist: Math.abs(y - relationStops[rel]) }));
      distances.sort((a, b) => a.dist - b.dist);
      return distances[0].rel;
    }

    let dragging = false;

    function startDrag(e) {
      dragging = true;
      swipeThumb.classList.add('dragging');
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      swipeThumb.style.top = `${Math.max(26, Math.min(174, clientY - swipeTrack.getBoundingClientRect().top))}px`;
      e.preventDefault();
    }

    function moveDrag(e) {
      if (!dragging) return;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const rect = swipeTrack.getBoundingClientRect();
      const top = Math.max(26, Math.min(174, clientY - rect.top));
      swipeThumb.style.top = `${top}px`;
      e.preventDefault();
    }

    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      swipeThumb.classList.remove('dragging');
      const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
      setRelation(relationFromY(clientY));
      e.preventDefault();
    }

    buildBtn.addEventListener('click', buildFromInputs);
    restoreBtn.addEventListener('click', restoreBuiltExpression);
    leftInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') buildFromInputs(); });
    rightInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') buildFromInputs(); });

    document.querySelectorAll('.opBtn').forEach(btn => {
      btn.addEventListener('click', () => {
        const amount = parseInt(btn.dataset.op, 10);
        if (btn.dataset.kind === 'divide-x') {
          applyDivideByNumberOfX();
        } else if (btn.dataset.kind === 'x') {
          applyXAddSubtract(amount);
        } else {
          applyConstantAddSubtract(amount);
        }
      });
    });

    swipeThumb.addEventListener('mousedown', startDrag);
    swipeTrack.addEventListener('mousedown', (e) => {
      if (e.target === swipeThumb) return;
      setRelation(relationFromY(e.clientY));
    });
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', endDrag);

    swipeThumb.addEventListener('touchstart', startDrag, { passive: false });
    swipeTrack.addEventListener('touchstart', (e) => {
      if (e.target === swipeThumb) return;
      setRelation(relationFromY(e.touches[0].clientY));
      e.preventDefault();
    }, { passive: false });
    window.addEventListener('touchmove', moveDrag, { passive: false });
    window.addEventListener('touchend', endDrag, { passive: false });

    buildFromInputs();
  </script>
</body>
</html>
